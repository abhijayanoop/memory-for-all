[project]
name = "memoryforall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
]

[project.scripts]
memoryforall = "memoryforall.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryforall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real embedding model (deselect with -m \"not slow\")"]
